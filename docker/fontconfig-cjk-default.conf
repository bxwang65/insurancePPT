<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- 把 CJK 字体顶到 sans-serif/serif 链头, 防 Chromium/headless 浏览器渲染中文方块.
       poster.html CSS 链 ("Noto Sans CJK SC", "WenQuanYi Zen Hei") 优先,
       此 conf 是兜底: 当 CSS 落回 sans-serif 时, fontconfig 自动 prepend CJK. -->
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
      <string>WenQuanYi Zen Hei</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK SC</string>
      <string>WenQuanYi Zen Hei</string>
    </edit>
  </match>
</fontconfig>